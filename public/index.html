<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAWWAL - Toko Online Fashion & Busana Muslim Premium</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Supabase browser SDK (gunakan publishable/anon key saja di frontend) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Babel Standalone for Inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-amber-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // KONFIGURASI SUPABASE FRONTEND: isi URL dan publishable/anon key.
    // Jangan pernah menaruh service_role/secret key atau Resend API key di sini.
    const SUPABASE_URL = "https://ljpqdhkeakghgoyibrma.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_o3YxlLjM2aXUCvOPe2ebUA_74B-wiTY";
    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    // --- HELPER COMPONENT UNTUK IKON LUCIDE ---
    const Icon = ({ name, className = "w-4 h-4", ...props }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });
      return <i data-lucide={name} className={className} {...props}></i>;
    };

    // --- DATA AWAL SIMULASI ---
    const INITIAL_PRODUCTS = [
      {
        id: 'prod-1',
        name: 'Gamis Modern Premium Edition SAWWAL',
        price: 350000,
        discountPrice: 289000,
        stock: 25,
        category: 'Busana Muslim',
        description: 'Gamis dengan bahan katun toyobo super halus, adem, tidak menerawang, dan sangat nyaman dipakai untuk acara formal maupun harian.',
        additionalInfo: 'Garansi retur 7 hari jika terdapat cacat pabrik atau salah ukuran. Instruksi pencucian: cuci lembut tanpa pemutih.',
        variations: 'Warna: Hitam, Navy, Olive | Ukuran: M, L, XL',
        image: 'https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?auto=format&fit=crop&q=80&w=600',
        salesCount: 142,
        rating: 4.9
      },
      {
        id: 'prod-2',
        name: 'Kemeja Koko Modern Slimfit SAWWAL',
        price: 220000,
        discountPrice: 175000,
        stock: 40,
        category: 'Busana Muslim',
        description: 'Kemeja koko berbahan kain katun linen premium dengan jahitan presisi, memberikan kesan gagah dan elegan saat beribadah.',
        additionalInfo: 'Bahan adem, tidak mudah kusut. Disarankan disetrika dengan suhu sedang.',
        variations: 'Warna: Putih, Abu, Mocca | Ukuran: L, XL, XXL',
        image: 'https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&q=80&w=600',
        salesCount: 98,
        rating: 4.8
      },
      {
        id: 'prod-3',
        name: 'Hijab Pashmina Silk Luxury Edition',
        price: 95000,
        discountPrice: 65000,
        stock: 60,
        category: 'Hijab & Aksesoris',
        description: 'Pashmina bermaterialkan silk berkualitas tinggi yang lembut, mengkilap mewah, mudah dibentuk, dan tegak di dahi.',
        additionalInfo: '100% Original SAWWAL Hijab Collection.',
        variations: 'Warna: Rose Gold, Mocca, Emerald, Jet Black',
        image: 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&q=80&w=600',
        salesCount: 230,
        rating: 5.0
      }
    ];

    const INITIAL_CATEGORIES = ['Semua', 'Busana Muslim', 'Hijab & Aksesoris', 'Pakaian Pria', 'Pakaian Wanita'];

    const INITIAL_BANNERS = [
      {
        id: 'b-1',
        title: 'PROMO SPESIAL HARI INI',
        subtitle: 'Diskon Hingga 50% Untuk Koleksi Eksklusif SAWWAL',
        image: 'https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&q=80&w=1200'
      }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [categories, setCategories] = useState(INITIAL_CATEGORIES);
      const [banners, setBanners] = useState(INITIAL_BANNERS);
      const [cart, setCart] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Semua');
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [infoModalTab, setInfoModalTab] = useState(null);
      
      const [activeView, setActiveView] = useState('home'); 
      const [ownerLoggedIn, setOwnerLoggedIn] = useState(false);
      const [userLoggedIn, setUserLoggedIn] = useState(null); 
      const [toastMessage, setToastMessage] = useState('');

      const [userAuthTab, setUserAuthTab] = useState('login'); 
      const [userLoginForm, setUserLoginForm] = useState({ email: '', password: '' });
      const [userRegisterForm, setUserRegisterForm] = useState({ name: '', email: '', phone: '', password: '' });

      const [customers, setCustomers] = useState([
        { id: 'c-1', name: 'Budi Santoso', email: 'budi@gmail.com', phone: '08123456789', status: 'Approved', registeredAt: new Date().toISOString() },
        { id: 'c-2', name: 'Siti Rahma', email: 'siti@gmail.com', phone: '08571234567', status: 'Pending', registeredAt: new Date().toISOString() }
      ]);

      const [orders, setOrders] = useState([]);
      const [emailNotifications, setEmailNotifications] = useState([]);

      const [storeSettings, setStoreSettings] = useState({
        name: 'SAWWAL Store',
        tagline: 'Fashion & Busana Muslim Premium',
        logoTextSize: 'text-sm sm:text-base',
        heroTitle: 'PROMO SPESIAL SAWWAL',
        heroSubtitle: 'Temukan koleksi busana muslim modern dan berkualitas tinggi dengan harga spesial hari ini.',
        footerDescription: 'Penyedia busana Muslim & E-Commerce fashion terkemuka dengan kualitas bahan premium dan desain eksklusif modern.',
        announcementText: '✨ Gratis Ongkir ke Seluruh Indonesia | Garansi Retur 7 Hari 100% Original',
        showAnnouncement: true,
        themeColor: 'amber',
        waNumber: '6288235985430',
        ownerEmail: 'satanteam034@gmail.com',
        bankInfo: 'BCA 1234567890 a.n SAWWAL Official',
        address: 'Jl. Pemuda No. 88, Jakarta Selatan',
        contentCaraBeli: '1. Pilih busana atau item favoritmu dari katalog produk.\n2. Klik tombol + Keranjang.\n3. Buka Keranjang Belanja, lalu klik Lanjut Ke Checkout.\n4. Isi data nama, nomor WhatsApp, serta alamat pengiriman.\n5. Klik Buat Pesanan & Pesan via WhatsApp.',
        contentGaransiRetur: '• Garansi retur 7 hari sejak barang diterima.\n• Pengembalian berlaku jika cacat pabrik atau salah ukuran.\n• Wajib menyertakan video unboxing paket.',
        contentSyaratKetentuan: '• Semua produk terjamin 100% original.\n• Pengiriman Senin - Sabtu.\n• Pesanan sebelum jam 15.00 WIB dikirim hari yang sama.',
        contentKontakCs: 'WhatsApp CS: +6288235985430\nEmail: satanxsawal@gmail.com\nJam Operasional: 08.00 - 21.00 WIB',
        contentKebijakanPrivasi: 'Kami menjaga kerahasiaan data pribadi Anda dengan standar enkripsi keamanan tertinggi. Data transaksi hanya digunakan untuk keperluan pengiriman pesanan dan tidak akan dibagikan ke pihak ketiga.\n\nTiktok @satanteam666_\nDeveloper satanteam034@gmail.com'
      });

      const [adminTab, setAdminTab] = useState('dashboard');

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const mapDbProduct = (p) => ({
        id: p.id, name: p.name, price: Number(p.price || 0),
        discountPrice: p.discount_price == null ? null : Number(p.discount_price),
        stock: Number(p.stock || 0), category: p.category || 'Umum',
        description: p.description || '', additionalInfo: p.additional_info || '',
        variations: p.variations || '', image: p.image_url || '',
        salesCount: Number(p.sales_count || 0), rating: Number(p.rating || 5)
      });

      const loadCloudProducts = async () => {
        const { data, error } = await supabaseClient.from('products')
          .select('*').eq('is_active', true).order('created_at', { ascending: false });
        if (error) { console.error('Load products:', error); return; }
        if (data && data.length) setProducts(data.map(mapDbProduct));
      };

      const loadOwnerOrders = async () => {
        const { data, error } = await supabaseClient.from('orders')
          .select('*').order('created_at', { ascending: false });
        if (error) { console.error('Load orders:', error); return; }
        setOrders((data || []).map(o => ({
          id: o.id, customerName: o.customer_name, customerPhone: o.customer_phone,
          address: o.address, notes: o.notes, paymentMethod: o.payment_method,
          items: o.items || [], total: Number(o.total || 0), status: o.status,
          createdAt: o.created_at
        })));
      };

      const persistProducts = async (updater) => {
        const next = typeof updater === 'function' ? updater(products) : updater;
        setProducts(next);
        const isUuid = (v) => /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(v));
        const rows = next.map(p => ({
          ...(isUuid(p.id) ? { id: p.id } : {}),
          name: p.name, price: Number(p.price || 0),
          discount_price: p.discountPrice == null ? null : Number(p.discountPrice),
          stock: Number(p.stock || 0), category: p.category || 'Umum',
          description: p.description || '', additional_info: p.additionalInfo || '',
          variations: p.variations || '', image_url: p.image || '',
          sales_count: Number(p.salesCount || 0), rating: Number(p.rating || 5),
          is_active: true
        }));
        const { data: existing, error: readError } = await supabaseClient.from('products').select('id');
        if (readError) { alert('Tidak dapat menyinkronkan produk: ' + readError.message); return; }
        const keepIds = rows.filter(r => r.id).map(r => r.id);
        const removed = (existing || []).map(r => r.id).filter(id => !keepIds.includes(id));
        if (removed.length) {
          const { error } = await supabaseClient.from('products').delete().in('id', removed);
          if (error) { alert('Gagal menghapus produk: ' + error.message); return; }
        }
        const { error } = await supabaseClient.from('products').upsert(rows);
        if (error) { alert('Gagal menyimpan produk: ' + error.message); return; }
        await loadCloudProducts();
      };

      useEffect(() => {
        loadCloudProducts();
        supabaseClient.auth.getSession().then(async ({ data }) => {
          if (!data?.session) return;
          const { data: isOwner, error } = await supabaseClient.rpc('is_owner');
          if (!error && isOwner) {
            setOwnerLoggedIn(true);
            await loadOwnerOrders();
          } else {
            await supabaseClient.auth.signOut();
          }
        });
      }, []);

      // Email asli dikirim oleh Supabase Database Webhook + Edge Function.
      // Browser tidak pernah memegang API key email.

      const handleAddToCart = (product, variation = '') => {
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id && item.variation === variation);
          if (existing) {
            return prev.map(item => item.id === product.id && item.variation === variation 
              ? { ...item, qty: item.qty + 1 } : item
            );
          }
          return [...prev, { ...product, variation, qty: 1 }];
        });
        showToast(`"${product.name}" ditambahkan!`);
      };

      const handleUpdateQty = (id, variation, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id && item.variation === variation) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const handleCheckoutSubmit = async (e, checkoutForm) => {
        e.preventDefault();
        if (cart.length === 0) return;

        if (SUPABASE_URL.includes("YOUR_PROJECT_REF") ||
            SUPABASE_ANON_KEY.includes("YOUR_SUPABASE_")) {
          alert("Hubungkan Supabase terlebih dahulu. Isi SUPABASE_URL dan SUPABASE_ANON_KEY di file HTML.");
          return;
        }

        const address = `${checkoutForm.address}, ${checkoutForm.city}, ${checkoutForm.postalCode}`;
        const safeItems = cart.map(item => ({
          product_id: String(item.id),
          name: String(item.name),
          variation: String(item.variation || ''),
          quantity: Number(item.qty),
          unit_price: Number(item.discountPrice || item.price)
        }));

        // Harga dan stok dihitung ulang oleh database, bukan dipercaya dari browser.
        const { data: createdOrder, error: orderError } = await supabaseClient.rpc('create_order', {
          p_customer_name: checkoutForm.name,
          p_customer_phone: checkoutForm.phone,
          p_address: address,
          p_notes: checkoutForm.notes || '',
          p_payment_method: checkoutForm.paymentMethod,
          p_items: cart.map(item => ({
            product_id: item.id,
            quantity: Number(item.qty),
            variation: String(item.variation || '')
          }))
        });

        if (orderError) {
          console.error('Supabase order error:', orderError);
          alert('Pesanan belum tersimpan: ' + orderError.message);
          return;
        }
        const orderId = createdOrder.id;
        const totalAmount = Number(createdOrder.total);
        const newOrder = {
          id: orderId,
          customerName: checkoutForm.name,
          customerPhone: checkoutForm.phone,
          address,
          notes: checkoutForm.notes,
          paymentMethod: checkoutForm.paymentMethod,
          items: cart,
          total: totalAmount,
          status: 'Pesanan Baru',
          createdAt: new Date().toISOString()
        };

        setOrders(prev => [newOrder, ...prev]);

        let waText = `*PESANAN BARU - ${storeSettings.name}*\n`;
        waText += `*ID:* ${orderId}\n`;
        waText += `*Nama:* ${checkoutForm.name}\n`;
        waText += `*No. WA:* ${checkoutForm.phone}\n`;
        waText += `*Alamat:* ${address}\n\n`;
        cart.forEach((item, idx) => {
          waText += `${idx + 1}. ${item.name} (${item.variation || 'Standar'}) x${item.qty}\n`;
        });
        waText += `\n*Total:* Rp ${totalAmount.toLocaleString('id-ID')}`;

        const waUrl = `https://wa.me/${storeSettings.waNumber}?text=${encodeURIComponent(waText)}`;
        setCart([]);
        setActiveView('home');
        showToast('Pesanan tersimpan! Notifikasi email sedang diproses.');
        window.location.href = waUrl;
      };

      const filteredProducts = products.filter(p => {
        const matchCat = selectedCategory === 'Semua' || p.category === selectedCategory;
        const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col antialiased">
          {toastMessage && (
            <div className="fixed top-2 right-2 z-50 bg-slate-900 text-white text-[9px] px-2.5 py-1 rounded-md shadow-md flex items-center gap-1 border border-slate-700 animate-bounce">
              <Icon name="check-circle-2" className="w-3 h-3 text-amber-400" />
              <span>{toastMessage}</span>
            </div>
          )}

          {storeSettings.showAnnouncement && storeSettings.announcementText && (
            <div className="bg-slate-900 text-amber-400 text-[8px] sm:text-[10px] py-1 px-2 text-center font-semibold tracking-wide">
              {storeSettings.announcementText}
            </div>
          )}

          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-100 shadow-2xs">
            <div className="max-w-7xl mx-auto px-2.5 sm:px-4 py-1.5 flex items-center justify-between gap-2">
              
              <div 
                onClick={() => setActiveView('home')}
                className="cursor-pointer flex items-center gap-1.5 group"
              >
                <div className="w-6 h-6 sm:w-7 sm:h-7 bg-gradient-to-tr from-amber-600 to-yellow-500 rounded-md flex items-center justify-center text-white font-black text-xs shadow-2xs group-hover:scale-105 transition-transform">
                  S
                </div>
                <div>
                  <span className={`${storeSettings.logoTextSize || 'text-xs sm:text-sm'} font-black tracking-tight text-slate-900 block leading-tight`}>
                    {storeSettings.name}
                  </span>
                </div>
              </div>

              {activeView === 'home' && (
                <div className="flex-1 max-w-sm mx-2 hidden sm:block">
                  <div className="relative">
                    <input 
                      type="text"
                      placeholder="Cari produk..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full bg-slate-100 text-slate-800 pl-7 pr-3 py-1 rounded-md text-[10px] outline-none focus:ring-1 focus:ring-amber-500 transition"
                    />
                    <Icon name="search" className="w-3 h-3 text-slate-400 absolute left-2 top-2" />
                  </div>
                </div>
              )}

              <div className="flex items-center gap-1">
                {userLoggedIn ? (
                  <div className="flex items-center gap-1 bg-slate-100 px-2 py-0.5 rounded-md">
                    <Icon name="user" className="w-2.5 h-2.5 text-amber-600 flex-shrink-0" />
                    <div className="text-[9px] sm:text-[11px] leading-tight">
                      <span className="font-bold text-slate-800 block line-clamp-1 max-w-[55px] sm:max-w-[85px] text-[9px] sm:text-[11px]">{userLoggedIn.name}</span>
                      <span className={`text-[7px] sm:text-[8px] font-extrabold ${userLoggedIn.status === 'Approved' ? 'text-emerald-600' : 'text-amber-600'}`}>
                        {userLoggedIn.status === 'Approved' ? 'Aktif' : 'Pending'}
                      </span>
                    </div>
                    <button 
                      onClick={() => { setUserLoggedIn(null); showToast('Keluar'); }}
                      className="ml-0.5 text-red-500 hover:text-red-700 font-bold p-0.5"
                    >
                      <Icon name="log-out" className="w-2.5 h-2.5" />
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={() => setActiveView('login-user')}
                    className="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-[9px] sm:text-[10px] font-bold transition flex items-center gap-1"
                  >
                    <Icon name="user" className="w-3 h-3 text-slate-600" />
                    <span>Masuk</span>
                  </button>
                )}

                <button 
                  onClick={() => setActiveView('cart')}
                  className="relative p-1.5 bg-amber-50 text-amber-700 rounded-md hover:bg-amber-100 transition"
                >
                  <Icon name="shopping-cart" className="w-3.5 h-3.5" />
                  {cart.length > 0 && (
                    <span className="absolute -top-1 -right-1 bg-amber-600 text-white font-black text-[7px] w-3 h-3 rounded-full flex items-center justify-center">
                      {cart.reduce((s, i) => s + i.qty, 0)}
                    </span>
                  )}
                </button>

                {ownerLoggedIn ? (
                  <div className="flex items-center gap-1">
                    <button 
                      onClick={() => setActiveView('owner-dashboard')}
                      className="bg-slate-900 text-amber-400 hover:bg-slate-800 px-2 py-1 rounded-md text-[9px] sm:text-[10px] font-bold transition flex items-center gap-1 shadow-2xs"
                    >
                      <Icon name="shield" className="w-2.5 h-2.5" />
                      <span>Panel</span>
                    </button>
                    <button 
                      onClick={() => {
                        setOwnerLoggedIn(false);
                        setActiveView('home');
                        showToast('Owner berhasil keluar');
                      }}
                      className="bg-red-50 hover:bg-red-100 text-red-600 px-1.5 py-1 rounded-md text-[9px] sm:text-[10px] font-bold transition flex items-center gap-1"
                      title="Keluar / Logout Owner"
                    >
                      <Icon name="log-out" className="w-2.5 h-2.5" />
                      <span>Keluar</span>
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={() => setActiveView('login-owner')}
                    className="p-1.5 text-slate-400 hover:text-slate-700 transition"
                    title="Owner"
                  >
                    <Icon name="shield" className="w-3.5 h-3.5" />
                  </button>
                )}
              </div>
            </div>

            {activeView === 'home' && (
              <div className="px-2.5 pb-1.5 sm:hidden">
                <div className="relative">
                  <input 
                    type="text"
                    placeholder="Cari produk..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-slate-100 text-slate-800 pl-7 pr-3 py-1 rounded-md text-[10px] outline-none focus:ring-1 focus:ring-amber-500"
                  />
                  <Icon name="search" className="w-3 h-3 text-slate-400 absolute left-2 top-2" />
                </div>
              </div>
            )}
          </header>

          <div className="flex-1">
            {activeView === 'home' && (
              <HomeView 
                banners={banners}
                categories={categories}
                selectedCategory={selectedCategory}
                setSelectedCategory={setSelectedCategory}
                products={filteredProducts}
                onSelectProduct={(p) => setSelectedProduct(p)}
                onAddToCart={handleAddToCart}
                storeSettings={storeSettings}
              />
            )}

            {activeView === 'cart' && (
              <CartView 
                cart={cart}
                onUpdateQty={handleUpdateQty}
                onProceedToCheckout={() => setActiveView('checkout')}
                onBackToShop={() => setActiveView('home')}
              />
            )}

            {activeView === 'checkout' && (
              <CheckoutView 
                cart={cart}
                userLoggedIn={userLoggedIn}
                onSubmitCheckout={handleCheckoutSubmit}
                onBackToCart={() => setActiveView('cart')}
              />
            )}

            {activeView === 'login-user' && (
              <UserAuthView 
                tab={userAuthTab}
                setTab={setUserAuthTab}
                loginForm={userLoginForm}
                setLoginForm={setUserLoginForm}
                registerForm={userRegisterForm}
                setRegisterForm={setUserRegisterForm}
                customers={customers}
                setCustomers={setCustomers}
                setUserLoggedIn={setUserLoggedIn}
                setActiveView={setActiveView}
                showToast={showToast}
              />
            )}

            {activeView === 'login-owner' && (
              <OwnerLoginView 
                onLoginSuccess={async () => {
                  setOwnerLoggedIn(true);
                  setActiveView('owner-dashboard');
                  await loadOwnerOrders();
                  await loadCloudProducts();
                  showToast('Selamat Datang Owner!');
                }}
              />
            )}

            {activeView === 'owner-dashboard' && (
              ownerLoggedIn ? (
                <OwnerDashboardView 
                  adminTab={adminTab}
                  setAdminTab={setAdminTab}
                  products={products}
                  setProducts={persistProducts}
                  categories={categories}
                  setCategories={setCategories}
                  banners={banners}
                  setBanners={setBanners}
                  orders={orders}
                  setOrders={setOrders}
                  customers={customers}
                  setCustomers={setCustomers}
                  emailNotifications={emailNotifications}
                  storeSettings={storeSettings}
                  setStoreSettings={setStoreSettings}

    // --- USER AUTH VIEW ---
    function UserAuthView({ tab, setTab, loginForm, setLoginForm, registerForm, setRegisterForm, customers, setCustomers, setUserLoggedIn, setActiveView, showToast }) {
      const handleLogin = (e) => {
        e.preventDefault();
        const found = customers.find(c => c.email.toLowerCase() === loginForm.email.toLowerCase());
        if (found) {
          setUserLoggedIn(found);
          showToast(`Selamat datang, ${found.name}!`);
          setActiveView('home');
        } else {
          alert('Email belum terdaftar.');
        }
      };

      const handleRegister = (e) => {
        e.preventDefault();
        const existing = customers.find(c => c.email.toLowerCase() === registerForm.email.toLowerCase());
        if (existing) {
          alert('Email sudah terdaftar!');
          return;
        }

        const newCust = {
          id: 'cust-' + Date.now(),
          name: registerForm.name,
          email: registerForm.email,
          phone: registerForm.phone,
          status: 'Pending',
          registeredAt: new Date().toISOString()
        };

        setCustomers(prev => [newCust, ...prev]);
        setUserLoggedIn(newCust);
        showToast('Pendaftaran berhasil!');
        setActiveView('home');
      };

      const handleGoogleSignIn = () => {
        const newGoogleCust = {
          id: 'cust-google-' + Date.now(),
          name: 'Google User',
          email: 'user.google@gmail.com',
          phone: '08123456789',
          status: 'Approved',
          registeredAt: new Date().toISOString()
        };
        setCustomers(prev => [newGoogleCust, ...prev]);
        setUserLoggedIn(newGoogleCust);
        showToast('Berhasil masuk dengan Google!');
        setActiveView('home');
      };

      return (
        <div className="max-w-xs mx-auto px-2.5 py-6">
          <div className="bg-white p-4 rounded-xl border border-slate-100 shadow-md space-y-2.5 text-[10px]">

    // --- OWNER LOGIN VIEW ---
    function OwnerLoginView({ onLoginSuccess }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const handleOwnerLogin = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) { setErrorMsg('Login gagal. Periksa email dan password.'); return; }
        const { data: allowed, error: ownerError } = await supabaseClient.rpc('is_owner');
        if (ownerError || !allowed) {
          await supabaseClient.auth.signOut();
          setErrorMsg('Akun ini tidak terdaftar sebagai owner SAWWAL.');
          return;
        }
        await onLoginSuccess();
      };

      return (
        <div className="max-w-xs mx-auto px-2.5 py-8">
          <div className="bg-white p-4 rounded-xl border border-slate-100 shadow-md space-y-2.5 text-[10px]">
            <div className="text-center space-y-1">
              <div className="w-8 h-8 bg-slate-900 text-amber-400 rounded-lg flex items-center justify-center mx-auto">
                <Icon name="shield" className="w-4 h-4" />
              </div>
              <h2 className="font-black text-slate-900 text-xs">Owner Login</h2>
            </div>

            {errorMsg && <div className="bg-red-50 text-red-600 p-1.5 rounded text-[9px] font-bold">{errorMsg}</div>}

            <form onSubmit={handleOwnerLogin} className="space-y-2">
              <div>
                <label className="block text-[8px] font-bold text-slate-700 mb-0.5">Email</label>
                <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full border p-1 rounded text-[10px] outline-none focus:ring-1 focus:ring-amber-500" />
              </div>
              <div>
                <label className="block text-[8px] font-bold text-slate-700 mb-0.5">Password</label>
                <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full border p-1 rounded text-[10px] outline-none focus:ring-1 focus:ring-amber-500" />
              </div>
              <button type="submit" className="w-full bg-slate-900 text-amber-400 font-bold py-1.5 rounded-lg text-[10px] shadow-2xs">Masuk Panel</button>
            </form>
          </div>
        </div>
      );
    }

                    <span className="text-amber-600">Rp {o.total.toLocaleString('id-ID')}</span>
                  </div>
                  <p className="text-slate-500 text-[9px]">{o.customerName} ({o.customerPhone})</p>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function AdminBannersPanel({ banners, setBanners, showToast }) {
      const [title, setTitle] = useState('');
      const [subtitle, setSubtitle] = useState('');
      const [image, setImage] = useState('');

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setImage(reader.result);
            showToast('Foto banner berhasil diunggah!');
          };
          reader.readAsDataURL(file);
        }
      };

      const handleAddBanner = (e) => {
        e.preventDefault();
        if (!title || !image) return;
        setBanners(prev => [{ id: 'b-' + Date.now(), title, subtitle, image }, ...prev]);
        setTitle('');
        setSubtitle('');
        setImage('');
        showToast('Banner promo ditambahkan!');
      };

      return (
        <div className="space-y-2.5 max-w-lg">
          <h2 className="text-xs sm:text-sm font-black text-slate-900">Kelola Banner Promo</h2>

          <form onSubmit={handleAddBanner} className="bg-white p-3 rounded-lg border space-y-2 text-[10px]">
            <h3 className="font-bold text-slate-800 text-[10px]">Tambah Banner Promo Baru</h3>
            <div>
              <label className="block text-[8px] font-bold mb-0.5">Judul Banner</label>
              <input type="text" required value={title} onChange={(e) => setTitle(e.target.value)} className="w-full border p-1 rounded text-[10px]" />
            </div>
            <div>
              <label className="block text-[8px] font-bold mb-0.5">Subjudul Promo</label>
              <input type="text" value={subtitle} onChange={(e) => setSubtitle(e.target.value)} className="w-full border p-1 rounded text-[10px]" />
            </div>
            <div>
              <label className="block text-[8px] font-bold mb-0.5">Foto Banner (Unggah File atau URL)</label>
              <div className="space-y-1">
                <input 
                  type="file" 
                  accept="image/*" 
                  onChange={handleImageUpload} 
                  className="w-full text-[9px] text-slate-500 cursor-pointer file:mr-2 file:py-0.5 file:px-2 file:rounded file:border-0 file:text-[9px] file:font-bold file:bg-amber-100 file:text-amber-800" 
                />
                <input 
                  type="url" 
                  placeholder="Atau masukkan URL Gambar..." 
                  required 
                  value={image} 
                  onChange={(e) => setImage(e.target.value)} 
                  className="w-full border p-1 rounded text-[10px]" 
                />
              </div>
              {image && <img src={image} alt="Preview" className="w-full h-16 object-cover rounded mt-1 border" />}
            </div>
            <button type="submit" className="w-full bg-amber-600 text-white font-bold py-1.5 rounded-lg text-[10px]">+ Simpan Banner</button>
          </form>

          <div className="bg-white rounded-lg border p-3 space-y-2 text-[10px]">
            <h3 className="font-bold text-slate-800 text-[10px]">Daftar Banner</h3>
            {banners.map((b) => (
              <div key={b.id} className="p-1.5 border rounded flex items-center justify-between gap-2">
                <img src={b.image} className="w-16 h-10 object-cover rounded" />
                <div className="flex-1">
                  <p className="font-bold leading-tight">{b.title}</p>
                  <p className="text-[8px] text-slate-400">{b.subtitle}</p>
                </div>
                <button onClick={() => { setBanners(prev => prev.filter(item => item.id !== b.id)); showToast('Banner dihapus'); }} className="text-red-500 font-bold text-[9px]">Hapus</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function AdminSettingsPanel({ storeSettings, setStoreSettings, showToast }) {
      const [form, setForm] = useState(storeSettings);
      return (
        <div className="space-y-2.5 max-w-lg">
          <h2 className="text-xs sm:text-sm font-black text-slate-900">Pengaturan Tampilan & Konten Toko</h2>
          <form onSubmit={(e) => { e.preventDefault(); setStoreSettings(form); showToast('Pengaturan disimpan!'); }} className="bg-white p-3 rounded-lg border space-y-2 text-[10px]">
            <div>
              <label className="block text-[8px] font-bold mb-0.5">Nama Toko</label>
              <input type="text" value={form.name} onChange={(e) => setForm({...form, name: e.target.value})} className="w-full border p-1 rounded text-[10px]" />
            </div>
            <div>
              <label className="block text-[8px] font-bold mb-0.5">Tagline Toko</label>
              <input type="text" value={form.tagline || ''} onChange={(e) => setForm({...form, tagline: e.target.value})} className="w-full border p-1 rounded text-[10px]" />
            </div>
            <div>
              <label className="block text-[8px] font-bold mb-0.5">Teks Pengumuman Atas (Announcement Bar)</label>
              <input type="text" value={form.announcementText || ''} onChange={(e) => setForm({...form, announcementText: e.target.value})} className="w-full border p-1 rounded text-[10px]" />
            </div>
            <div>
              <label className="block text-[8px] font-bold mb-0.5">Judul Utama Banner Hero (Promo)</label>
              <input type="text" value={form.heroTitle || ''} onChange={(e) => setForm({...form, heroTitle: e.target.value})} className="w-full border p-1 rounded text-[10px]" />
            </div>
            <div>
              <label className="block text-[8px] font-bold mb-0.5">Subjudul Banner Hero</label>
              <input type="text" value={form.heroSubtitle || ''} onChange={(e) => setForm({...form, heroSubtitle: e.target.value})} className="w-full border p-1 rounded text-[10px]" />
            </div>
            <div>
              <label className="block text-[8px] font-bold mb-0.5">Deskripsi Singkat Footer</label>
              <textarea rows={2} value={form.footerDescription || ''} onChange={(e) => setForm({...form, footerDescription: e.target.value})} className="w-full border p-1 rounded text-[10px]" />
            </div>
            <div>
              <label className="block text-[8px] font-bold mb-0.5">Nomor WhatsApp CS (Tanpa karakter +, Contoh: 6288235985430)</label>
              <input type="text" value={form.waNumber} onChange={(e) => setForm({...form, waNumber: e.target.value})} className="w-full border p-1 rounded text-[10px]" />
            </div>
            <div>
              <label className="block text-[8px] font-bold mb-0.5">Email Owner</label>
              <input type="email" value={form.ownerEmail || ''} onChange={(e) => setForm({...form, ownerEmail: e.target.value})} className="w-full border p-1 rounded text-[10px]" />
            </div>
            <div>
              <label className="block text-[8px] font-bold mb-0.5">Alamat Fisik Toko</label>
              <textarea rows={2} value={form.address || ''} onChange={(e) => setForm({...form, address: e.target.value})} className="w-full border p-1 rounded text-[10px]" />
            </div>

            <div className="pt-1 border-t">
              <h3 className="font-bold text-slate-800 text-[9px] mb-1">Pengaturan Isi Halaman Layanan Pelanggan & Informasi Kontak</h3>
              <div className="space-y-1.5">
                <div>
                  <label className="block text-[8px] font-bold mb-0.5">Isi Halaman Cara Pembelian & Checkout</label>
                  <textarea rows={2} value={form.contentCaraBeli} onChange={(e) => setForm({...form, contentCaraBeli: e.target.value})} className="w-full border p-1 rounded text-[10px]" />
                </div>
                <div>
                  <label className="block text-[8px] font-bold mb-0.5">Isi Halaman Informasi Garansi Retur</label>
                  <textarea rows={2} value={form.contentGaransiRetur} onChange={(e) => setForm({...form, contentGaransiRetur: e.target.value})} className="w-full border p-1 rounded text-[10px]" />
                </div>
                <div>
                  <label className="block text-[8px] font-bold mb-0.5">Isi Halaman Syarat & Ketentuan</label>
                  <textarea rows={2} value={form.contentSyaratKetentuan} onChange={(e) => setForm({...form, contentSyaratKetentuan: e.target.value})} className="w-full border p-1 rounded text-[10px]" />
                </div>
                <div>
                  <label className="block text-[8px] font-bold mb-0.5">Isi Halaman Kontak CS</label>
                  <textarea rows={2} value={form.contentKontakCs} onChange={(e) => setForm({...form, contentKontakCs: e.target.value})} className="w-full border p-1 rounded text-[10px]" />
                </div>
              </div>
            </div>

            <button type="submit" className="w-full bg-amber-600 text-white font-bold py-1.5 rounded-lg text-[10px]">Simpan Pengaturan Tampilan & Konten</button>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
